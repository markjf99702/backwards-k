<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Backwards K</title>
  <meta name="description" content="Keep score at a baseball or softball game on your phone or tablet. Tap what happened and Backwards K moves the runners, keeps the count, outs, score and pitch counts, and fills in a classic paper scorecard as you go.">
  <meta property="og:title" content="Backwards K">
  <meta property="og:description" content="Keep score at the ballpark. Tap what happened; the scorecard fills itself in.">
  <meta property="og:image" content="https://backwards-k.junkdrawer.works/og.png">
  <meta property="og:url" content="https://backwards-k.junkdrawer.works/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1c2a44" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070c17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/source-sans-3.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/big-shoulders.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
  <script data-boot>
    // If the app doesn't start, because one of its files didn't come or two of them are from different versions,
    // the page reloads, once. A copy kept for offline by an older sw.js (which could mix versions) goes first, so
    // that reload comes from the network; today's sw.js keeps only whole versions, and gives it one of those or the
    // network's. Only while a service worker answers for the page, so never in the one-file copy. (It comes after
    // app.js's tag: before it, Chromium asked for app.js twice, one after the other.)
    (() => {
      const sw = navigator.serviceWorker, K = 'backwards-k.boot', t0 = Date.now();
      if (!sw || !sw.controller) return;
      const started = () => !!document.querySelector('#app > *');
      let once = false;
      const heal = async () => {
        if (once || started()) return;
        once = true;
        try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, '1'); } catch { return; }
        try { for (const k of await caches.keys()) if (/^backwards-k-v\d+$/.test(k)) await caches.delete(k); } catch { /* reload anyway */ }
        location.reload();
      };
      addEventListener('error', e => {
        const t = e.target;
        if (t === window || (t && (t.localName === 'script' || (t.localName === 'link' && t.rel === 'stylesheet')))) heal();
      }, true);
      // Not started in 6 seconds: reload. Started: a later page load can reload once again if it has to.
      const tick = setInterval(() => {
        if (started()) { clearInterval(tick); try { sessionStorage.removeItem(K); } catch { /* nothing to clear */ } }
        else if (Date.now() - t0 > 6000) heal();
      }, 500);
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <footer class="jd-foot">
    <a href="https://junkdrawer.works/">Part of junkdrawer.works</a>
    <span aria-hidden="true">·</span>
    <a href="https://junkdrawer.works/privacy.html">Privacy</a>
  </footer>

  <noscript><p class="noscript">Backwards K needs JavaScript to keep score.</p></noscript>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-body"></div>
    <div class="toast sheet-toast" role="status" aria-live="polite"></div>
  </dialog>
</body>
</html>
